name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run reactor tests
        run: mvn -B clean test

      - name: Package reactor
        run: mvn -B -DskipTests package

      - name: Run offline Quickstart
        run: java -jar examples/quickstart/target/ai-context-quickstart-0.1.0-SNAPSHOT.jar

  spring-ai-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring_ai_version:
          - "1.0.0"
          - "1.1.8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install current ACO snapshot
        run: mvn -B -DskipTests install

      - name: Test Spring AI consumer fixture
        run: >-
          mvn -B -f compatibility/spring-ai-consumer/pom.xml
          -Dspring-ai.version=${{ matrix.spring_ai_version }} clean test
